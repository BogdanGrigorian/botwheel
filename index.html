<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hello World Mini App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="card">
      <span class="badge">Telegram Mini App</span>
      <h1 class="title">Hello, World! 👋</h1>
      <p class="subtitle">Welcome to your first Telegram Mini App.</p>

      <div class="clock">
        <div class="clock-time" id="clock-time">--:--:--</div>
        <div class="clock-date" id="clock-date">Loading date…</div>
      </div>

      <div class="url-box">
        <span class="url-label">Current URL</span>
        <code class="current-url" id="current-url">Loading URL…</code>
      </div>
    </div>

    <p class="user-info" id="user-info">Loading user info…</p>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botwheel Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Lock screen -->
    <section id="lock-screen" class="card">
      <span class="badge">Telegram Mini App</span>
      <h1 class="title">Botwheel Vault</h1>
      <p class="subtitle">Unlock the vault with your encryption key.</p>

      <label class="field">
        <span class="field-label">Password</span>
        <input
          type="password"
          id="password"
          class="input"
          placeholder="Encryption key"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </label>

      <button id="load-btn" class="button" type="button">Load from buffer</button>

      <div id="paste-field" class="field" hidden>
        <span class="field-label">Paste the vault message</span>
        <textarea
          id="paste-area"
          class="textarea"
          rows="4"
          placeholder="VLT1:..."
          spellcheck="false"
        ></textarea>
      </div>

      <div id="result" class="result" hidden></div>
    </section>

    <!-- Main screen (search) -->
    <section id="main-screen" class="main-screen" hidden>
      <header class="main-header">
        <div class="main-title">
          <span class="badge">Botwheel Vault</span>
          <span id="vault-meta" class="vault-meta"></span>
        </div>
        <button id="lock-btn" class="icon-btn" type="button" title="Lock vault">🔒</button>
      </header>

      <div class="search-wrap">
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Search resources & tags"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button id="clear-btn" class="clear-btn" type="button" hidden aria-label="Clear search">×</button>
      </div>

      <div id="letter-strip-wrap" class="letter-strip-wrap" hidden>
        <div id="letter-strip" class="letter-strip"></div>
      </div>

      <div id="filter-bar" class="filter-bar" hidden>
        <span id="filter-label" class="filter-label"></span>
        <button id="reset-btn" class="reset-btn" type="button">Reset filter</button>
      </div>

      <div class="list-wrap">
        <ul id="results" class="results"></ul>
      </div>
    </section>

    <!-- Record details -->
    <section id="details-screen" class="details-screen" hidden>
      <header class="details-header">
        <button id="details-back" class="icon-btn" type="button" aria-label="Back">←</button>
        <span class="details-title">Record details</span>
        <span id="details-status" class="details-status" hidden></span>
      </header>

      <div class="details-body">
        <div class="detail-field">
          <span class="field-label">Title</span>
          <span id="details-name" class="detail-value detail-name"></span>
        </div>

        <div class="detail-field">
          <span class="field-label">Login</span>
          <span id="details-login" class="detail-value detail-secret" title="Tap to copy"></span>
        </div>

        <div class="detail-field">
          <span class="field-label">Email</span>
          <span id="details-email" class="detail-value detail-secret" title="Tap to copy"></span>
        </div>

        <div class="detail-field">
          <span class="field-label">Password</span>
          <div class="secret-row">
            <span id="details-password" class="detail-value detail-password detail-secret" title="Tap to copy"></span>
            <button id="reveal-password" class="mini-btn" type="button">Show</button>
          </div>
        </div>

        <div class="detail-field">
          <span class="field-label">URL</span>
          <a id="details-url" class="detail-value detail-link" target="_blank" rel="noopener"></a>
        </div>

        <div class="detail-field">
          <span class="field-label">Notes</span>
          <span id="details-notes" class="detail-value detail-notes"></span>
        </div>
      </div>
    </section>

    <p class="user-info" id="user-info">Loading user info…</p>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="crypto-core.js"></script>
  <script src="app.js"></script>
</body>
</html>

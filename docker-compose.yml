services:
  botwheel-bot:
    image: ghcr.io/bogdangrigorian/botwheel-bot:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      MINIAPP_URL: ${MINIAPP_URL:-https://bogdangrigorian.github.io/botwheel/}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_DB_PATH: /data/botwheel
      # Server-side at-rest key. Default is /data/botwheel.key (auto-created);
      # for real separation mount it from a different volume, or pass a base64
      # 32-byte key via TELEGRAM_DB_KEY. Set TELEGRAM_DB_KEY_FILE=off to disable.
      TELEGRAM_DB_KEY_FILE: /data/botwheel.key
      # TELEGRAM_SEED_FILE: /data/test-vault.txt
    volumes:
      # Persistent storage for the embedded H2 vault database.
      - ./data:/data
      # - ./java/test-vault.txt:/data/test-vault.txt:ro

services:
  botwheel-bot:
    image: ghcr.io/bogdangrigorian/botwheel-bot:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      MINIAPP_URL: ${MINIAPP_URL:-https://bogdangrigorian.github.io/botwheel/}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_DB_PATH: /data/botwheel
      # TELEGRAM_SEED_FILE: /data/test-vault.txt
    volumes:
      # Persistent storage for the embedded H2 vault database.
      - ./data:/data
      # - ./java/test-vault.txt:/data/test-vault.txt:ro
